# Maintain a compact, persistent summary of the latest Frigate reviews for the
# Echo Show dashboard. Frigate already publishes this data over MQTT, so no
# additional API credentials or polling are required.
input_text:
  echo_recent_frigate_detections:
    name: Echo recent Frigate detections
    max: 255
    icon: mdi:cctv

template:
  - sensor:
      - name: Echo clock time
        unique_id: echo_clock_time
        state: "{{ now().strftime('%H:%M') }}"
      - name: Echo clock date
        unique_id: echo_clock_date
        state: "{{ now().strftime('%a %-d %b %Y') }}"
      - name: Echo recent detections heading
        unique_id: echo_recent_detections_heading
        state: Recent detections
      - name: Echo recent detection 1
        unique_id: echo_recent_detection_1
        state: >-
          {% set events = states('input_text.echo_recent_frigate_detections') | from_json([]) %}
          {% if events %}
            {% set event = events[0] %}
            {{ event.t }} · {{ event.c }} · {{ event.o }}
          {% else %}
            No recent detections
          {% endif %}
        attributes:
          event_time: >-
            {% set events = states('input_text.echo_recent_frigate_detections') | from_json([]) %}
            {{ events[0].t if events else '' }}
          event_camera: >-
            {% set events = states('input_text.echo_recent_frigate_detections') | from_json([]) %}
            {{ events[0].c if events else '' }}
          event_object: >-
            {% set events = states('input_text.echo_recent_frigate_detections') | from_json([]) %}
            {{ events[0].o if events else '' }}
      - name: Echo recent detection 2
        unique_id: echo_recent_detection_2
        availability: >-
          {{ states('input_text.echo_recent_frigate_detections') | from_json([]) | count > 1 }}
        state: >-
          {% set events = states('input_text.echo_recent_frigate_detections') | from_json([]) %}
          {% set event = events[1] if events | count > 1 else {'t': '', 'c': '', 'o': ''} %}
          {{ event.t }} · {{ event.c }} · {{ event.o }}
        attributes:
          event_time: >-
            {% set events = states('input_text.echo_recent_frigate_detections') | from_json([]) %}
            {{ events[1].t if events | count > 1 else '' }}
          event_camera: >-
            {% set events = states('input_text.echo_recent_frigate_detections') | from_json([]) %}
            {{ events[1].c if events | count > 1 else '' }}
          event_object: >-
            {% set events = states('input_text.echo_recent_frigate_detections') | from_json([]) %}
            {{ events[1].o if events | count > 1 else '' }}
      - name: Echo recent detection 3
        unique_id: echo_recent_detection_3
        availability: >-
          {{ states('input_text.echo_recent_frigate_detections') | from_json([]) | count > 2 }}
        state: >-
          {% set events = states('input_text.echo_recent_frigate_detections') | from_json([]) %}
          {% set event = events[2] if events | count > 2 else {'t': '', 'c': '', 'o': ''} %}
          {{ event.t }} · {{ event.c }} · {{ event.o }}
        attributes:
          event_time: >-
            {% set events = states('input_text.echo_recent_frigate_detections') | from_json([]) %}
            {{ events[2].t if events | count > 2 else '' }}
          event_camera: >-
            {% set events = states('input_text.echo_recent_frigate_detections') | from_json([]) %}
            {{ events[2].c if events | count > 2 else '' }}
          event_object: >-
            {% set events = states('input_text.echo_recent_frigate_detections') | from_json([]) %}
            {{ events[2].o if events | count > 2 else '' }}

automation:
  - id: echo_show_remember_recent_frigate_detections
    alias: "Echo Show · Remember recent Frigate detections"
    description: "Keeps the latest three Frigate review summaries for the Echo dashboard."
    triggers:
      - trigger: mqtt
        topic: frigate/reviews
    variables:
      camera: "{{ trigger.payload_json.after.camera | default('', true) }}"
      objects: "{{ trigger.payload_json.after.data.objects | default([], true) }}"
      camera_names:
        garage: Garage
        living_room_side: Living-room side
        kitchen: Kitchen
        living_room_back: Living-room back
        snug: Snug
        nest: Outside
      camera_name: "{{ camera_names.get(camera, camera | replace('_', ' ') | title) }}"
      object_text: >-
        {{ objects | map('replace', '_', ' ') | map('title') | sort | join(', ') }}
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.payload_json.type | default('') == 'new' and
             camera | length > 0 and objects | count > 0 }}
    actions:
      - action: input_text.set_value
        target:
          entity_id: input_text.echo_recent_frigate_detections
        data:
          value: >-
            {% set current = states('input_text.echo_recent_frigate_detections') | from_json([]) %}
            {% set item = {'t': now().strftime('%H:%M'), 'c': camera_name, 'o': object_text} %}
            {{ ([item] + current)[:3] | to_json }}
    mode: queued
    max: 10
