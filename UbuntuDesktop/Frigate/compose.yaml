services:
  nest-relay:
    image: bluenviron/mediamtx:1.16.3
    container_name: frigate-nest-relay
    restart: unless-stopped
    command: ["/mediamtx.yml"]
    volumes:
      - ./nest-transcode/mediamtx.yml:/mediamtx.yml:ro
    # Scrypted uses host networking and consumes the repaired stream here.
    # Loopback-only binding keeps the relay private to ubuntu-desktop.
    ports:
      - "127.0.0.1:8556:8554"
    healthcheck:
      test:
        - CMD
        - /mediamtx
        - --version
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  nest-transcoder:
    image: frigate-nest-transcoder:local
    build:
      context: ./nest-transcode
      dockerfile: Dockerfile
    container_name: frigate-nest-transcoder
    restart: unless-stopped
    environment:
      TZ: Europe/London
    depends_on:
      nest-relay:
        condition: service_started
    # Only the Arc render node is exposed. The RTX 3080 remains unavailable to
    # this container and dedicated to display/gaming work.
    devices:
      - "/dev/dri/arc-a310-render:/dev/dri/renderD128"
    cpu_shares: 128
    entrypoint: ["/bin/bash", "/opt/nest-transcode/run.sh"]
    volumes:
      - ./nest-transcode/run.sh:/opt/nest-transcode/run.sh:ro
    secrets:
      - source: starling_nest_rtsp_url
        target: FRIGATE_STARLING_NEST_RTSP_URL
    healthcheck:
      test:
        - CMD
        - /usr/lib/ffmpeg/7.0/bin/ffprobe
        - -v
        - error
        - -rtsp_transport
        - tcp
        - -show_entries
        - stream=codec_name
        - rtsp://nest-relay:8554/nest
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    container_name: frigate
    restart: unless-stopped
    # Use spare CPU freely at idle, but yield scheduler time to host gaming and
    # Steam streaming workloads when the system is busy.
    cpu_shares: 256
    stop_grace_period: 30s
    shm_size: "512mb"
    environment:
      TZ: Europe/London
    # A host udev rule gives the Arc a stable name regardless of DRM probe
    # order. Do not map /dev/dri wholesale: that would expose the RTX 3080.
    devices:
      - "/dev/dri/arc-a310-render:/dev/dri/renderD128"
    # Allows Frigate's intel_gpu_top integration to read Arc utilization.
    # This is substantially narrower than privileged mode.
    cap_add:
      - CAP_PERFMON
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${FRIGATE_DATA_PATH:-/home/abhi/Docker/Frigate/data}:/config
      - ./config/config.yml:/config/config.yml:ro
      - ${FRIGATE_MEDIA_PATH:-/srv/frigate}:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    ports:
      - "${FRIGATE_BIND_IP:-192.168.0.180}:8971:8971"
      - "${FRIGATE_BIND_IP:-192.168.0.180}:8554:8554"
      - "${FRIGATE_BIND_IP:-192.168.0.180}:8555:8555/tcp"
      - "${FRIGATE_BIND_IP:-192.168.0.180}:8555:8555/udp"
    secrets:
      - source: tapo_rtsp_user
        target: FRIGATE_TAPO_USER
      - source: tapo_rtsp_password
        target: FRIGATE_TAPO_PASSWORD
      - source: go2rtc_user
        target: FRIGATE_GO2RTC_USER
      - source: go2rtc_password
        target: FRIGATE_GO2RTC_PASSWORD
      - source: mqtt_password
        target: FRIGATE_MQTT_PASSWORD
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/version', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

secrets:
  tapo_rtsp_user:
    file: ${FRIGATE_SECRETS_PATH:-/home/abhi/Docker/Frigate/secrets}/tapo_rtsp_user
  tapo_rtsp_password:
    file: ${FRIGATE_SECRETS_PATH:-/home/abhi/Docker/Frigate/secrets}/tapo_rtsp_password
  starling_nest_rtsp_url:
    file: ${FRIGATE_SECRETS_PATH:-/home/abhi/Docker/Frigate/secrets}/starling_nest_rtsp_url
  go2rtc_user:
    file: ${FRIGATE_SECRETS_PATH:-/home/abhi/Docker/Frigate/secrets}/go2rtc_user
  go2rtc_password:
    file: ${FRIGATE_SECRETS_PATH:-/home/abhi/Docker/Frigate/secrets}/go2rtc_password
  mqtt_password:
    file: ${FRIGATE_SECRETS_PATH:-/home/abhi/Docker/Frigate/secrets}/mqtt_password
