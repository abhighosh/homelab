services:
  ntfy:
    image: binwiederhier/ntfy:v2.26.0
    container_name: ntfy
    command:
      - serve
    init: true
    restart: unless-stopped
    environment:
      TZ: Europe/London
    volumes:
      - ./server.yml:/etc/ntfy/server.yml:ro
      # Keep runtime state outside Komodo's disposable Git checkout so a
      # reclone cannot replace the authentication and message databases.
      - ${NTFY_DATA_PATH:-/home/abhi/Docker/Ntfy/data}:/var/lib/ntfy
    ports:
      # The Echo Show is LAN-only and cannot resolve the Tailscale-only public
      # proxy. Expose the same authenticated server on a LAN-bound HTTP port;
      # no management UI or other reverse-proxied service is exposed with it.
      - "${NTFY_LAN_IP:-192.168.0.220}:2586:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://127.0.0.1:80/v1/health -O - | grep -Eq '\"healthy\"[[:space:]]*:[[:space:]]*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      proxy:
        aliases:
          - ntfy

networks:
  proxy:
    external: true
    name: proxy
