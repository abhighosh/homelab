# Public URL served by Nginx Proxy Manager over the Tailscale-only proxy.
base-url: "https://ntfy.abhighosh.co.uk"
behind-proxy: true

# Persist recent messages so mobile clients can retrieve notifications missed
# while disconnected. Access is deny-by-default; the camera-alert topic alone
# has an anonymous read-only ACL so additional trusted displays need no account.
cache-file: "/var/lib/ntfy/cache.db"
cache-duration: "24h"
auth-file: "/var/lib/ntfy/auth.db"
auth-default-access: "deny-all"
enable-login: true
enable-signup: false

# The iOS app needs the public ntfy service to forward an APNS/FCM wake-up.
# Notification messages and the authoritative message cache remain here.
upstream-base-url: "https://ntfy.sh"

# Uploaded files remain disabled. Camera notifications use Frigate's temporary
# snapshot URL as an external attachment, so ntfy does not duplicate or retain
# image data on disk.
