esphome:
  name: crowpanel-dashboard-01
  friendly_name: CrowPanel Dashboard
  min_version: 2026.7.2
  project:
    name: homelab.crowpanel-dashboard
    version: dashboard-43
  on_boot:
    - priority: 600
      then:
        - lambda: |-
            const uint8_t touch_enable = 250;
            id(board_controller).write(&touch_enable, 1);
        - delay: 250ms
        - lambda: |-
            const uint8_t compatible_brightness = 16;
            id(board_controller).write(&compatible_brightness, 1);
        - lambda: |-
            // Ensure the controller-driven buzzer is silent after boot.
            const uint8_t buzzer_off = 0x16;
            id(board_controller).write(&buzzer_off, 1);
esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    # Standard ESP-IDF RGB-panel settings recommended by Elecrow and Espressif.
    # Keep the CPU at its supported maximum, align the data cache for bounce-
    # buffer transfers, and keep flash writes from interrupting PSRAM access
    # used by the continuously scanned display framebuffer. Retain the 32 KB
    # cache size: 64 KB left too little internal heap for Wi-Fi RX buffers on
    # this feature-rich dashboard (ESP_ERR_NO_MEM during Wi-Fi initialization).
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_32KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_FREERTOS_HZ: "1000"

psram:
  mode: octal
  # Standard ESP-IDF setting for this ESP32-S3 N16R8 module. The panel proved
  # substantially more reliable at 80 MHz than with experimental 120 MHz PSRAM.
  speed: 80MHz
  ignore_not_found: false

logger:
  hardware_uart: UART0
  level: INFO

api:
  encryption:
    key: !secret cat_panel_01_api_key

ota:
  - platform: esphome
    password: !secret cat_panel_01_ota_password

wifi:
  ap:
    ssid: CrowPanel Dashboard Setup
    password: !secret cat_panel_01_fallback_password

captive_portal:

# Used only by the documented online_image component. Home Assistant prepares
# an exact-size PNG from Sonos's entity_picture and serves it on the local LAN.
http_request:
  timeout: 5s
  follow_redirects: true
  # Artwork is served only by Home Assistant over the trusted local network.
  verify_ssl: false

i2c:
  id: panel_i2c
  sda: GPIO15
  scl: GPIO16
  frequency: 400kHz
  scan: true

i2c_device:
  id: board_controller
  i2c_id: panel_i2c
  address: 0x30

display:
  - platform: rpi_dpi_rgb
    id: panel
    dimensions:
      width: 800
      height: 480
    color_order: RGB
    pclk_frequency: 18MHz
    pclk_inverted: true
    de_pin: GPIO42
    hsync_pin: GPIO40
    vsync_pin: GPIO41
    pclk_pin: GPIO39
    hsync_pulse_width: 4
    hsync_front_porch: 8
    hsync_back_porch: 8
    vsync_pulse_width: 4
    vsync_front_porch: 8
    vsync_back_porch: 8
    data_pins:
      red: [GPIO7, GPIO17, GPIO18, GPIO3, GPIO46]
      green: [GPIO9, GPIO10, GPIO11, GPIO12, GPIO13, GPIO14]
      blue: [GPIO21, GPIO47, GPIO48, GPIO45, GPIO38]
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: gt911
    id: panel_touch
    display: panel
    i2c_id: panel_i2c
    address: 0x5D
    update_interval: 50ms
    on_touch:
      - script.execute: backlight_active
      - script.execute: touch_ping

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      - script.execute: refresh_clock
    on_time:
      - seconds: 0
        minutes: "*"
        then:
          - script.execute: refresh_clock

globals:
  - id: cat_unsafe
    type: bool
    restore_value: false
    initial_value: "false"
  - id: cat_attention
    type: bool
    restore_value: false
    initial_value: "true"

script:
  - id: touch_ping
    mode: restart
    then:
      - lambda: |-
          // CrowPanel Advance V1.1 controller command: buzzer on.
          const uint8_t buzzer_on = 0x15;
          id(board_controller).write(&buzzer_on, 1);
      - delay: 10ms
      - lambda: |-
          // CrowPanel Advance V1.1 controller command: buzzer off.
          const uint8_t buzzer_off = 0x16;
          id(board_controller).write(&buzzer_off, 1);

  - id: backlight_active
    then:
      - lambda: |-
          const uint8_t active_brightness = 16;
          id(board_controller).write(&active_brightness, 1);
          ESP_LOGI("backlight", "Active brightness");

  - id: backlight_dim
    then:
      - lambda: |-
          // This panel's controller uses Elecrow's legacy 5..16 range:
          // 5 is off and 16 is maximum brightness.
          const uint8_t idle_brightness = 6;
          id(board_controller).write(&idle_brightness, 1);
          ESP_LOGI("backlight", "Idle brightness");

  - id: refresh_clock
    then:
      - lvgl.label.update:
          id: clock_label
          text: !lambda |-
            auto now = id(ha_time).now();
            return now.is_valid() ? now.strftime("%H:%M") : std::string("--:--");

  - id: refresh_cat_cards
    then:
      - lambda: |-
          const bool missing =
            !id(cat_room).has_state() ||
            id(cat_room).state.empty() ||
            id(cat_room).state == "unknown" ||
            id(cat_room).state == "unavailable" ||
            id(cat_room).state == "not_home";
          const std::string room = missing ? std::string() : id(cat_room).state;
          id(cat_unsafe) = !missing &&
            room != "ground_hallway" &&
            room != "kitchen" &&
            room != "first_floor_hallway" &&
            room != "bathroom" &&
            room != "second_floor_hallway";
          id(cat_attention) = missing || id(cat_unsafe);
      - if:
          condition:
            lambda: return id(cat_attention);
          then:
            - script.execute: backlight_active
          else:
            - if:
                condition:
                  lvgl.is_idle:
                    timeout: 60s
                then:
                  - script.execute: backlight_dim
      - if:
          condition:
            lambda: |-
              return !id(cat_room).has_state() ||
                     id(cat_room).state.empty() ||
                     id(cat_room).state == "unknown" ||
                     id(cat_room).state == "unavailable" ||
                     id(cat_room).state == "not_home";
          then:
            - lvgl.label.update:
                id: cat_location_label
                text: "Not detected"
            - lvgl.label.update:
                id: cat_safety_label
                text: "CHECK COLLAR"
            - lvgl.widget.update:
                id: cat_card
                bg_color: 0x9C2634
          else:
            - lvgl.label.update:
                id: cat_location_label
                text: !lambda |-
                  std::string room = id(cat_room).state;
                  for (auto &c : room) if (c == '_') c = ' ';
                  bool cap = true;
                  for (auto &c : room) {
                    if (cap && c >= 'a' && c <= 'z') c -= 32;
                    cap = (c == ' ');
                  }
                  return room;
            - if:
                condition:
                  lambda: return id(cat_unsafe);
                then:
                  - lvgl.label.update:
                      id: cat_safety_label
                      text: "FORBIDDEN ROOM"
                  - lvgl.widget.update:
                      id: cat_card
                      bg_color: 0x9C2634
                else:
                  - lvgl.label.update:
                      id: cat_safety_label
                      text: "SAFE"
                  - lvgl.widget.update:
                      id: cat_card
                      bg_color: 0x176B4D

  - id: refresh_schedule_controls
    then:
      - if:
          condition:
            lambda: return id(roborock_schedule_enabled).has_state();
          then:
            - lvgl.widget.update:
                id: overview_roborock_schedule_switch
                state:
                  checked: !lambda return id(roborock_schedule_enabled).state;
            - lvgl.label.update:
                id: overview_roborock_schedule_label
                text: !lambda |-
                  return id(roborock_schedule_enabled).state
                    ? std::string("SCHEDULED") : std::string("OFF");
      - if:
          condition:
            lambda: return id(husqvarna_schedule_enabled).has_state();
          then:
            - lvgl.widget.update:
                id: overview_husqvarna_schedule_switch
                state:
                  checked: !lambda return id(husqvarna_schedule_enabled).state;
            - lvgl.label.update:
                id: overview_husqvarna_schedule_label
                text: !lambda |-
                  return id(husqvarna_schedule_enabled).state
                    ? std::string("SCHEDULED") : std::string("OFF");

  - id: update_room_tiles
    parameters:
      data: string
    then:
      - lambda: |-
          static std::string labels[12];
          static const char *map[16];
          auto trim = [](std::string &value) {
            const auto first = value.find_first_not_of(" \t\r\n");
            if (first == std::string::npos) {
              value.clear();
              return;
            }
            const auto last = value.find_last_not_of(" \t\r\n");
            value = value.substr(first, last - first + 1);
          };
          size_t start = 0;
          for (int i = 0; i < 12; i++) {
            std::string name{" "};
            std::string cat_state;
            std::string phone_state{"0"};
            if (start < data.size()) {
              size_t end = data.find('|', start);
              if (end == std::string::npos) end = data.size();
              std::string entry = data.substr(start, end - start);
              start = end + 1;
              size_t first_separator = entry.find(':');
              if (first_separator != std::string::npos && first_separator > 0) {
                name = entry.substr(0, first_separator);
                size_t second_separator = entry.find(':', first_separator + 1);
                if (second_separator == std::string::npos) {
                  cat_state = entry.substr(first_separator + 1);
                } else {
                  cat_state = entry.substr(
                    first_separator + 1,
                    second_separator - first_separator - 1);
                  phone_state = entry.substr(second_separator + 1);
                }
                trim(name);
                trim(cat_state);
                trim(phone_state);
                if (name.empty()) name = " ";
              }
            }

            labels[i] = name;
            if (cat_state == "1") labels[i] += "\n#34D399 C#";
            if (cat_state == "2") labels[i] += "\n#FFB4B4 C#";
            if (phone_state == "1") {
              labels[i] += (cat_state == "1" || cat_state == "2")
                ? "  #60A5FA A#" : "\n#60A5FA A#";
            }
            if (cat_state == "?" && phone_state == "?") labels[i] += "\n?";

            lv_buttonmatrix_clear_button_ctrl(
              id(room_matrix)->obj, i,
              static_cast<lv_buttonmatrix_ctrl_t>(
                LV_BUTTONMATRIX_CTRL_CHECKED |
                LV_BUTTONMATRIX_CTRL_DISABLED |
                LV_BUTTONMATRIX_CTRL_HIDDEN));
            if (cat_state == "2") {
              lv_buttonmatrix_set_button_ctrl(
                id(room_matrix)->obj, i, LV_BUTTONMATRIX_CTRL_CHECKED);
            } else if (cat_state == "?" && phone_state == "?") {
              lv_buttonmatrix_set_button_ctrl(
                id(room_matrix)->obj, i, LV_BUTTONMATRIX_CTRL_DISABLED);
            } else if (name == " ") {
              lv_buttonmatrix_set_button_ctrl(
                id(room_matrix)->obj, i, LV_BUTTONMATRIX_CTRL_HIDDEN);
            }
          }
          map[0] = labels[0].c_str();
          map[1] = labels[1].c_str();
          map[2] = labels[2].c_str();
          map[3] = labels[3].c_str();
          map[4] = "\n";
          map[5] = labels[4].c_str();
          map[6] = labels[5].c_str();
          map[7] = labels[6].c_str();
          map[8] = labels[7].c_str();
          map[9] = "\n";
          map[10] = labels[8].c_str();
          map[11] = labels[9].c_str();
          map[12] = labels[10].c_str();
          map[13] = labels[11].c_str();
          map[14] = "";
          map[15] = nullptr;
          lv_buttonmatrix_set_map(id(room_matrix)->obj, map);

  - id: update_media_favorites
    parameters:
      data: string
    then:
      - lambda: |-
          lv_obj_t *buttons[] = {
            id(media_favorite_button_1), id(media_favorite_button_2),
            id(media_favorite_button_3), id(media_favorite_button_4),
            id(media_favorite_button_5), id(media_favorite_button_6),
            id(media_favorite_button_7), id(media_favorite_button_8),
            id(media_favorite_button_9), id(media_favorite_button_10),
            id(media_favorite_button_11), id(media_favorite_button_12)
          };
          lv_obj_t *labels[] = {
            id(media_favorite_label_1), id(media_favorite_label_2),
            id(media_favorite_label_3), id(media_favorite_label_4),
            id(media_favorite_label_5), id(media_favorite_label_6),
            id(media_favorite_label_7), id(media_favorite_label_8),
            id(media_favorite_label_9), id(media_favorite_label_10),
            id(media_favorite_label_11), id(media_favorite_label_12)
          };
          lv_obj_t *quick_buttons[] = {
            id(media_quick_favorite_button_1),
            id(media_quick_favorite_button_2),
            id(media_quick_favorite_button_3)
          };
          lv_obj_t *quick_labels[] = {
            id(media_quick_favorite_label_1),
            id(media_quick_favorite_label_2),
            id(media_quick_favorite_label_3)
          };
          size_t start = 0;
          for (int i = 0; i < 12; i++) {
            std::string label;
            if (start <= data.size()) {
              size_t end = data.find('|', start);
              if (end == std::string::npos) end = data.size();
              label = data.substr(start, end - start);
              start = end + 1;
            }
            const auto first = label.find_first_not_of(" \t\r\n");
            if (first == std::string::npos) {
              label.clear();
            } else {
              const auto last = label.find_last_not_of(" \t\r\n");
              label = label.substr(first, last - first + 1);
            }
            auto replace_all = [](std::string &value, const std::string &from,
                                  const std::string &to) {
              size_t pos = 0;
              while ((pos = value.find(from, pos)) != std::string::npos) {
                value.replace(pos, from.size(), to);
                pos += to.size();
              }
            };
            replace_all(label, "\xE2\x80\x98", "'");
            replace_all(label, "\xE2\x80\x99", "'");
            replace_all(label, "\xE2\x80\x9C", "\"");
            replace_all(label, "\xE2\x80\x9D", "\"");
            replace_all(label, "\xE2\x80\x93", "-");
            replace_all(label, "\xE2\x80\x94", "-");
            replace_all(label, "\xE2\x88\x92", "-");
            replace_all(label, "\xC2\xA0", " ");
            lv_label_set_text(labels[i], label.c_str());
            if (i < 3) lv_label_set_text(quick_labels[i], label.c_str());
            if (label.empty()) {
              lv_obj_add_state(buttons[i], LV_STATE_DISABLED);
              if (i < 3) lv_obj_add_state(quick_buttons[i], LV_STATE_DISABLED);
            } else {
              lv_obj_clear_state(buttons[i], LV_STATE_DISABLED);
              if (i < 3) lv_obj_clear_state(quick_buttons[i], LV_STATE_DISABLED);
            }
          }

text_sensor:
  - platform: homeassistant
    id: cat_room
    entity_id: sensor.cat_collar_confirmed_room
    on_value:
      then:
        - script.execute: refresh_cat_cards

  - platform: homeassistant
    id: iphone_room
    entity_id: sensor.abhi_iphone_room
    on_value:
      then:
        - lvgl.label.update:
            id: iphone_location_label
            text: !lambda |-
              std::string room = x;
              if (room.empty() || room == "unknown" ||
                  room == "unavailable" || room == "not_home") {
                return std::string("Not detected");
              }
              for (auto &c : room) if (c == '_') c = ' ';
              bool cap = true;
              for (auto &c : room) {
                if (cap && c >= 'a' && c <= 'z') c -= 32;
                cap = (c == ' ');
              }
              return room;

  - platform: homeassistant
    id: room_tiles
    entity_id: sensor.cat_panel_room_tiles
    on_value:
      then:
        - script.execute:
            id: update_room_tiles
            data: !lambda return x;

  - platform: homeassistant
    id: sonos_state
    entity_id: media_player.kitchen_kitchen
    on_value:
      then:
        - lvgl.label.update:
            id: overview_sonos_state_label
            text: !lambda |-
              if (x == "playing") return std::string("PLAYING");
              if (x == "paused") return std::string("PAUSED");
              if (x == "unavailable") return std::string("UNAVAILABLE");
              return std::string("IDLE");
        - lvgl.label.update:
            id: media_state_label
            text: !lambda |-
              if (x == "playing") return std::string("Playing");
              if (x == "paused") return std::string("Paused");
              if (x == "unavailable") return std::string("Unavailable");
              return std::string("Idle");
        - lvgl.label.update:
            id: media_play_pause_label
            text: !lambda |-
              return x == "playing" ? std::string(LV_SYMBOL_PAUSE)
                                    : std::string(LV_SYMBOL_PLAY);
        - lvgl.widget.update:
            id: overview_media_card
            bg_color: !lambda |-
              if (x == "playing") return lv_color_hex(0x176B4D);
              if (x == "paused") return lv_color_hex(0x65558A);
              if (x == "unavailable") return lv_color_hex(0x712B38);
              return lv_color_hex(0x1D4058);
        - lvgl.widget.update:
            id: overview_media_tint
            bg_color: !lambda |-
              if (x == "playing") return lv_color_hex(0x0B4F3A);
              if (x == "paused") return lv_color_hex(0x4C3D70);
              if (x == "unavailable") return lv_color_hex(0x5B1F2A);
              return lv_color_hex(0x102F45);
        - lvgl.widget.update:
            id: media_artwork_tint
            bg_color: !lambda |-
              if (x == "playing") return lv_color_hex(0x082C22);
              if (x == "paused") return lv_color_hex(0x2D2445);
              if (x == "unavailable") return lv_color_hex(0x3F1720);
              return lv_color_hex(0x081B28);
  - platform: homeassistant
    id: sonos_title
    entity_id: media_player.kitchen_kitchen
    attribute: media_title
    on_value:
      then:
        - lvgl.label.update:
            id: overview_sonos_title_label
            text: !lambda |-
              std::string value = x.empty() ? std::string("Nothing playing") : x;
              auto replace_all = [](std::string &text, const std::string &from,
                                    const std::string &to) {
                size_t pos = 0;
                while ((pos = text.find(from, pos)) != std::string::npos) {
                  text.replace(pos, from.size(), to);
                  pos += to.size();
                }
              };
              replace_all(value, "\xE2\x80\x98", "'");
              replace_all(value, "\xE2\x80\x99", "'");
              replace_all(value, "\xE2\x80\x9C", "\"");
              replace_all(value, "\xE2\x80\x9D", "\"");
              replace_all(value, "\xE2\x80\x93", "-");
              replace_all(value, "\xE2\x80\x94", "-");
              replace_all(value, "\xE2\x88\x92", "-");
              replace_all(value, "\xC2\xA0", " ");
              return value;
        - lvgl.label.update:
            id: media_title_label
            text: !lambda |-
              std::string value = x.empty() ? std::string("Nothing playing") : x;
              auto replace_all = [](std::string &text, const std::string &from,
                                    const std::string &to) {
                size_t pos = 0;
                while ((pos = text.find(from, pos)) != std::string::npos) {
                  text.replace(pos, from.size(), to);
                  pos += to.size();
                }
              };
              replace_all(value, "\xE2\x80\x98", "'");
              replace_all(value, "\xE2\x80\x99", "'");
              replace_all(value, "\xE2\x80\x9C", "\"");
              replace_all(value, "\xE2\x80\x9D", "\"");
              replace_all(value, "\xE2\x80\x93", "-");
              replace_all(value, "\xE2\x80\x94", "-");
              replace_all(value, "\xE2\x88\x92", "-");
              replace_all(value, "\xC2\xA0", " ");
              return value;

  - platform: homeassistant
    id: sonos_artist
    entity_id: media_player.kitchen_kitchen
    attribute: media_artist
    on_value:
      then:
        - lvgl.label.update:
            id: overview_sonos_artist_label
            text: !lambda return x;
        - lvgl.label.update:
            id: media_artist_label
            text: !lambda return x;

  - platform: homeassistant
    id: sonos_entity_picture
    entity_id: media_player.kitchen_kitchen
    attribute: entity_picture
    on_value:
      then:
        - if:
            condition:
              lambda: |-
                return x.empty() || x == "unknown" || x == "unavailable";
            then:
              - lvgl.widget.hide: overview_sonos_artwork
              - lvgl.widget.hide: media_sonos_artwork
              - online_image.release: sonos_album_art
            else:
              # Home Assistant creates the small PNG asynchronously when this
              # attribute changes. Give that server-side conversion time to
              # finish, then fetch the fixed local URL.
              - delay: 3s
              - component.update: sonos_album_art

  - platform: homeassistant
    id: sonos_source
    entity_id: media_player.kitchen_kitchen
    attribute: source
    on_value:
      then:
        - lvgl.label.update:
            id: media_source_label
            text: !lambda return x;

  - platform: homeassistant
    id: sonos_shuffle
    entity_id: media_player.kitchen_kitchen
    attribute: shuffle
    on_value:
      then:
        - lvgl.label.update:
            id: media_shuffle_label
            text: !lambda |-
              const bool enabled = x == "true" || x == "on" || x == "1";
              return enabled ? std::string("SHUFFLE ON")
                             : std::string("SHUFFLE");
        - lvgl.widget.update:
            id: media_shuffle_button
            bg_color: !lambda |-
              const bool enabled = x == "true" || x == "on" || x == "1";
              return lv_color_hex(enabled ? 0x176B4D : 0x25313A);

  - platform: homeassistant
    id: sonos_favorite_labels
    entity_id: sensor.panel_sonos_favorites
    attribute: labels
    on_value:
      then:
        - script.execute:
            id: update_media_favorites
            data: !lambda return x;

  - platform: homeassistant
    id: roborock_status
    entity_id: sensor.roborock_q7_l5_status
    on_value:
      then:
        - lvgl.label.update:
            id: overview_roborock_status_label
            text: !lambda |-
              std::string value = x;
              for (auto &c : value) if (c == '_' || c == '-') c = ' ';
              bool cap = true;
              for (auto &c : value) {
                if (cap && c >= 'a' && c <= 'z') c -= 32;
                cap = (c == ' ');
              }
              return value;
        - lvgl.label.update:
            id: overview_roborock_toggle_status_label
            text: !lambda |-
              std::string value = x;
              for (auto &c : value) if (c == '_' || c == '-') c = ' ';
              bool cap = true;
              for (auto &c : value) {
                if (cap && c >= 'a' && c <= 'z') c -= 32;
                cap = (c == ' ');
