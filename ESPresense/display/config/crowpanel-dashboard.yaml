  - platform: online_image
    id: sonos_album_art
    url: "http://192.168.0.220:8123/local/crowpanel/sonos-artwork.png"
    format: PNG
    type: RGB565
    transparency: opaque
    # One PSRAM-backed image serves both the large Media canvas and the clipped
    # Overview preview. Avoiding a second decoded copy preserves heap headroom.
    resize: 512x328
    update_interval: never
    # Smaller than the documented 64 KiB default to limit transient memory and
    # reduce the chance of a long decode starving the display/API tasks.
    buffer_size: 32768
    on_download_finished:
      # Runtime images have no pixel data when the LVGL widget is created.
      # Reassign the source after each download so LVGL refreshes its descriptor.
      - lvgl.image.update:
          id: overview_sonos_artwork
          src: sonos_album_art
      - lvgl.image.update:
          id: media_sonos_artwork
          src: sonos_album_art
      - lvgl.widget.show: overview_sonos_artwork
      - lvgl.widget.show: media_sonos_artwork
    on_error:
      - lvgl.widget.hide: overview_sonos_artwork
      - lvgl.widget.hide: media_sonos_artwork

