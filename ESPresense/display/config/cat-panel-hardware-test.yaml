esphome:
  name: cat-panel-01
  friendly_name: Cat Panel 01
  min_version: 2026.7.2
  project:
    name: homelab.cat-panel
    version: hardware-test-1

esp32:
  variant: esp32
  flash_size: 4MB
  framework:
    type: esp-idf
  toolchain: esp-idf

logger:

api:
  encryption:
    key: !secret cat_panel_01_api_key

ota:
  - platform: esphome
    password: !secret cat_panel_01_ota_password

wifi:
  ap:
    ssid: Cat Panel 01 Setup
    password: !secret cat_panel_01_fallback_password

captive_portal:

# The ELEGOO GE-GYE-EB-008 follows the original E32R28T/CYD wiring.
# The LCD and resistive touch controller use separate SPI buses. Touch is
# deliberately omitted from this first image until the LCD is confirmed.
spi:
  - id: display_spi
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO21

light:
  - platform: monochromatic
    id: backlight
    name: Backlight
    output: backlight_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 0s

display:
  - platform: mipi_spi
    id: panel
    model: ILI9341
    spi_id: display_spi
    cs_pin: GPIO15
    dc_pin: GPIO2
    data_rate: 10MHz
    color_order: bgr
    color_depth: 16
    buffer_size: 12%
    auto_clear_enabled: false
    update_interval: never

# With no custom widgets ESPHome renders its standard LVGL test page. This is
# intentional: it checks geometry, colour order, rotation and available RAM.
lvgl:
  displays: panel
  buffer_size: 25%
